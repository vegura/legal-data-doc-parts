[project]
name = "legal-data-doc-parts"
version = "0.1.0"
description = ""
authors = [
    {name = "vegura",email = "annadominie@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "jupyterlab (>=4.6.2,<5.0.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "accelerate (>=1.14.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "google-cloud (>=0.34.0,<0.35.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "pandas-stubs (>=3.0.5,<3.1.0)",
    "google-cloud-bigquery (>=3.42.3,<4.0.0)",
    "google-cloud-storage (>=3.13.0,<4.0.0)",
    "db-dtypes (>=1.7.1,<2.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "pyfunctional (>=1.5.0,<2.0.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[tool.poetry]
packages = [{include = "legal_data_doc_parts", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
